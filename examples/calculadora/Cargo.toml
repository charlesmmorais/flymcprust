[package]
name = "calculadora"
description = "Example MCP server: a calculator (stdio or Streamable HTTP)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
schemars.workspace = true
mcpsdkrust = { workspace = true, features = ["stdio", "http", "logging"] }
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true

[dev-dependencies]
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-child-process"] }
mcpsdkrust = { workspace = true, features = ["test-client"] }
serde_json.workspace = true

[lints]
workspace = true
