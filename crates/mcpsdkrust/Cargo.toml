[package]
name = "mcpsdkrust"
description = "MCP server SDK for Rust: ergonomic, safe and fast Model Context Protocol servers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
schemars.workspace = true
mcpsdkrust-core.workspace = true
mcpsdkrust-macros = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["macros"]
## The `#[tool]` attribute macro.
macros = ["dep:mcpsdkrust-macros"]
## stdio transport.
stdio = ["mcpsdkrust-core/stdio"]
## Streamable HTTP transport.
http = ["mcpsdkrust-core/http"]
## Built-in JWT verifier for OAuth access tokens (implies `http`).
oauth = ["http", "mcpsdkrust-core/oauth"]
## `logging::init()`: write the SDK's log (including fix-it hints) to stderr.
logging = ["dep:tracing-subscriber"]
## In-process `testing::TestClient` for integration tests.
test-client = ["mcpsdkrust-core/test-client"]
## `ServerBuilder::auto_tools()`: register every `#[tool]` in the binary.
auto-register = ["macros", "mcpsdkrust-core/auto-register", "mcpsdkrust-macros/auto-register"]

[dev-dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
trybuild = "1.0.104"

[lints]
workspace = true
