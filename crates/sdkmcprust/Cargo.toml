[package]
name = "sdkmcprust"
description = "An ergonomic, safe and fast SDK for Model Context Protocol servers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
schemars.workspace = true
sdkmcprust-core.workspace = true
sdkmcprust-macros = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["macros"]
## The `#[tool]` attribute macro.
macros = ["dep:sdkmcprust-macros"]
## stdio transport.
stdio = ["sdkmcprust-core/stdio"]
## Streamable HTTP transport.
http = ["sdkmcprust-core/http"]
## `logging::init()`: write the SDK's log (including fix-it hints) to stderr.
logging = ["dep:tracing-subscriber"]
## In-process `testing::TestClient` for integration tests.
test-client = ["sdkmcprust-core/test-client"]
## `ServerBuilder::auto_tools()`: register every `#[tool]` in the binary.
auto-register = ["macros", "sdkmcprust-core/auto-register", "sdkmcprust-macros/auto-register"]

[dev-dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
trybuild = "1.0.104"

[lints]
workspace = true
