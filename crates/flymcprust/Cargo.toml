[package]
name = "flymcprust"
description = "High-performance MCP server SDK for Rust: fast, safe, simple and stateless Model Context Protocol servers"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flymcprust"
# Tests (and their fixtures, such as a test-only RSA key) stay in the repository.
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
schemars.workspace = true
flymcprust-core.workspace = true
flymcprust-macros = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["macros"]
## The `#[tool]` attribute macro.
macros = ["dep:flymcprust-macros"]
## stdio transport.
stdio = ["flymcprust-core/stdio"]
## Streamable HTTP transport.
http = ["flymcprust-core/http"]
## Built-in JWT verifier for OAuth access tokens (implies `http`).
oauth = ["http", "flymcprust-core/oauth"]
## `logging::init()`: write the SDK's log (including fix-it hints) to stderr.
logging = ["dep:tracing-subscriber"]
## In-process `testing::TestClient` for integration tests.
test-client = ["flymcprust-core/test-client"]
## `ServerBuilder::auto_tools()`: register every `#[tool]` in the binary.
auto-register = ["macros", "flymcprust-core/auto-register", "flymcprust-macros/auto-register"]

[dev-dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
trybuild = "1.0.104"

[lints]
workspace = true
