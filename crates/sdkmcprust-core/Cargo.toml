[package]
name = "sdkmcprust-core"
description = "Runtime and transports for SDKMCPRust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
base64.workspace = true
bytes = { workspace = true, optional = true }
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
memchr.workspace = true
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
schemars.workspace = true
sdkmcprust-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util.workspace = true
tower-service.workspace = true
tracing.workspace = true

[features]
default = []
## Newline-delimited JSON-RPC over stdin/stdout (or any byte stream).
stdio = ["tokio/io-std", "tokio/io-util", "tokio/rt"]
## Streamable HTTP (stateless) as a tower service, plus a hyper-based server.
http = [
    "dep:bytes",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/net",
    "tokio/rt",
]

## In-process `testing::TestClient` for integration tests.
test-client = []
## Registry used by `ServerBuilder::auto_tools` (see docs/ARCHITECTURE.md §9).
auto-register = ["dep:inventory"]

[dev-dependencies]
criterion = { version = "0.8.1", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util", "io-util", "net"] }
tracing-subscriber.workspace = true

[lints]
workspace = true

[[bench]]
name = "hot_path"
harness = false
