[package]
name = "sdkmcprust-core"
description = "Runtime and transports for SDKMCPRust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
futures-util.workspace = true
schemars.workspace = true
sdkmcprust-spec.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util.workspace = true
tower-service.workspace = true
tracing.workspace = true

[features]
default = []
## Newline-delimited JSON-RPC over stdin/stdout (or any byte stream).
stdio = ["tokio/io-std", "tokio/io-util", "tokio/rt"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util", "io-util"] }

[lints]
workspace = true
