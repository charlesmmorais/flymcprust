[package]
name = "flymcprust-macros"
description = "Procedural macros (`#[tool]`, `#[resource]`, `#[prompt]`) of FlyMCPRust. Use the `flymcprust` crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flymcprust-macros"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "3", features = ["full"] }

[features]
## Emit `inventory` registrations so `ServerBuilder::auto_tools` finds tools.
auto-register = []

[lints]
workspace = true
