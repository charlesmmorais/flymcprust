# Fuzz targets (cargo-fuzz). Not a member of the main workspace: building
# needs a nightly toolchain and libFuzzer.
#
#   cargo install cargo-fuzz
#   cd fuzz && cargo +nightly fuzz run parse_message
#
# Note: `fuzz_target!` expands to `unsafe` FFI glue, so this harness cannot
# use `#![forbid(unsafe_code)]`. It is test-only code and is never shipped
# (see docs/ARCHITECTURE.md §9).
[package]
name = "flymcprust-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.10"
flymcprust-core = { path = "../crates/flymcprust-core", features = ["oauth", "http"] }
serde_json = "1.0.140"
bytes = "1.10.1"
http = "1.3.1"
http-body-util = "0.1.3"
tokio = { version = "1.47.0", features = ["rt", "time"] }
tower-service = "0.3.3"
tokio-util = "0.7.15"

[[bin]]
name = "parse_message"
path = "fuzz_targets/parse_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handle_message"
path = "fuzz_targets/handle_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "match_uri"
path = "fuzz_targets/match_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_jwt"
path = "fuzz_targets/verify_jwt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false

# Keep this crate out of the parent workspace.
[workspace]
