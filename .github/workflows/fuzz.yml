# Long fuzzing runs: every target for 15 minutes, weekly and on demand.
# The CI workflow only runs a 60-second smoke test per target.
name: Fuzz

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "900"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [parse_message, handle_message, match_uri, verify_jwt, http_request]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || 900 }}
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
