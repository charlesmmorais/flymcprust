[package]
name = "bench-rmcp"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.10.1"
flymcprust = { path = "../../../crates/flymcprust", features = ["oauth"] }
http-body-util = "0.1.3"
tower-service = "0.3.3"
hyper-util = { version = "0.1.16", features = ["tokio", "server", "http1", "service", "client-legacy"] }
rmcp = { version = "=3.7.0", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-io"] }
schemars.workspace = true
serde.workspace = true
tokio.workspace = true
hyper = { version = "1.6.0", features = ["server", "http1"] }
