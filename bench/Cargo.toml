# Comparative benchmarks: the same MCP server written with SDKMCPRust, rmcp
# and the official Python SDK, driven by one load generator.
# Separate workspace (excluded from the main one) so regular builds and CI
# stay light. Run from the repository root:
#
#   cargo run --release --manifest-path bench/Cargo.toml -p mcp-load -- suite
[workspace]
members = ["servers/sdkmcprust", "servers/rmcp", "loadgen"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.47.0", features = ["macros", "rt-multi-thread", "net", "signal"] }

# Same optimization settings for every Rust server.
[profile.release]
lto = "thin"
codegen-units = 1
