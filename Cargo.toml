[workspace]
members = ["crates/*", "xtask", "examples/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The FlyMCPRust contributors"]
keywords = ["mcp", "mcp-server", "sdk", "ai", "llm"]
categories = ["network-programming", "asynchronous", "api-bindings"]
repository = "https://github.com/charlesmmorais/flymcprust"
homepage = "https://github.com/charlesmmorais/flymcprust"
publish = true

[workspace.dependencies]
# Internal crates.
flymcprust = { path = "crates/flymcprust", version = "0.1.1" }
flymcprust-core = { path = "crates/flymcprust-core", version = "0.1.1" }
flymcprust-macros = { path = "crates/flymcprust-macros", version = "0.1.1" }
flymcprust-spec = { path = "crates/flymcprust-spec", version = "0.1.1" }

# External crates.
base64 = "0.22.1"
bytes = "1.10.1"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
memchr = "2.7.4"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
inventory = "0.3.20"
# OAuth (feature `oauth`): signature checks with ring, HTTPS with rustls on
# ring and the operating system's roots (no aws-lc, no webpki-roots).
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "tls12", "ring", "native-tokio"] }
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1.6.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio", "server-graceful", "http1"] }
schemars = { version = "1.0.4", default-features = false, features = ["std", "derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["raw_value"] }
sha2 = "0.11.0"
thiserror = "2.0.12"
tokio = { version = "1.47.0", default-features = false }
tokio-util = { version = "0.7.15", default-features = false }
tower-service = "0.3.3"
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# No panics on the request path (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# stdout belongs to the stdio transport.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Keep debug builds small: full debug info for workspace crates only at
# line-table granularity, none for dependencies (MSVC .pdb files are large).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
