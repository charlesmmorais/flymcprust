[workspace]
members = ["crates/*", "xtask", "examples/*"]
default-members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["The SDKMCPRust contributors"]
keywords = ["mcp", "model-context-protocol", "sdk", "ai", "llm"]
categories = ["network-programming", "asynchronous", "api-bindings"]
publish = false

[workspace.dependencies]
# Internal crates.
sdkmcprust = { path = "crates/sdkmcprust", version = "0.1.0" }
sdkmcprust-core = { path = "crates/sdkmcprust-core", version = "0.1.0" }
sdkmcprust-macros = { path = "crates/sdkmcprust-macros", version = "0.1.0" }
sdkmcprust-spec = { path = "crates/sdkmcprust-spec", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
# No panics on the request path (tests are allowed via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# stdout belongs to the stdio transport.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
